<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("Hei");
        document.write("<h1>Overskrift H1</h1>");

        // variabel
        let forNavn = "jens";
        document.write(forNavn);
        document.write("<br>");
        let etterNavn = "stoltenberg";
        let fulltNavn = `${forNavn} ${etterNavn}`;
        document.write(fulltNavn);
        document.write("<br>");
        // integer, answer 8
        document.write(5 + 3);
        document.write("<br>");
        // string, answer 53
        document.write("5" + "3");
        document.write("<br>");
        let tall = 5;
        tall = tall + 3; // 8
        tall++; // adds 1
        tall += 4; // adds 4
        tall -= 2; // subtracts 2
        tall --; // subtracts 1
        document.write(tall);
    </script>
</body>
</html>
