    <center><h1>Ordbok for Gamere</h1></center>
    <h2>In the following list you'll find multiple abbreviations/terms used by gamers.</h2>
    <ul>
        <li><abbr title="[Usually said at the start of a game]"><strong>GL:</strong> <em>Good luck</em></abbr></li>
        <li><abbr title="[Almost always said in combination with GL]"><strong>HF:</strong> <em>Have fun</em></abbr></li>
        <li><abbr title="[A salty phrase accusing the opponent of using cheats to gain an advantage.]"><strong>NH:</strong> <em>Nice hacks</em></abbr></li>
        <li><abbr title="[Generally said positively after an intense failed attempt to 'clutch' a game.]"><strong>NT:</strong> <em>Nice try</em></abbr></li>
        <li><abbr title="[Somewhat similar to NT, though usually said at the end of the entire game, not per round.]"><strong>WP:</strong> <em>Well played</em></abbr></li>
        <li><abbr title="[A farewell said at the end of the game, shows good sportsmanship.]"><strong>GG:</strong> <em>Good Game</em></abbr></li>
    </ul>
</body>
